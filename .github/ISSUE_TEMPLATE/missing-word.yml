name: Missing word or phrase
description: Give an exact example so coverage and recognition can be checked separately.
title: 'Missing: '
body:
  - type: input
    id: text
    attributes:
      label: Exact word or phrase
      placeholder: 鎌かけて
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Short context and intended meaning
      description: Include a short non-private snippet and a public source link if possible. Do not upload private messages or entire books.
  - type: dropdown
    id: behavior
    attributes:
      label: What failed?
      options:
        - Manual search has no matching entry
        - Manual search works but hover lookup does not
        - Dictionary import failed
        - Definition or nuance is wrong
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Host app and version; dict. release
