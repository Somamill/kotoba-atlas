name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests
      - run: python branding/dot/check.py
      - name: Ensure private build inputs are not tracked
        run: |
          if git ls-files | grep -E '(^|/)(dict-personal\.zip|\.cache/|.*\.sqlite$)'; then
            exit 1
          fi
