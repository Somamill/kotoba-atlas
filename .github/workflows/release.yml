name: Build public release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: python branding/dot/check.py
      - run: python scripts/build.py
      - run: python scripts/validate.py dist/dict-master.zip
      - name: Keep public build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dict-public
          path: |
            dist/dict-master.zip
            dist/public-report.json
            dist/dict-master.validation.json
          retention-days: 30
