<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="710" viewBox="0 0 1400 710" role="img" aria-labelledby="title desc"><title id="title">Coverage by record family</title><desc id="desc">German lookup pairs: 1,566,695. English: 1,080,167. Each edition has 1,006,753 native metadata and 10,384 native kanji records. Independent counts, not additive.</desc><style>:root{--paper:#FAF8F4;--ink:#242622;--muted:#60645C;--line:#DADDD5;--accent:#906530;--green:#42684B;--dark:#151815;--light:#F4F3EC;--gold:#D7B685;--sage:#A9C7AE;--sans:system-ui,-apple-system,sans-serif;--serif:Georgia,"Times New Roman",serif}text{font-family:var(--sans);fill:var(--ink)}.serif{font-family:var(--serif)}.muted{fill:var(--muted)}.light{fill:var(--light)}.gold{fill:var(--gold)}.sage{fill:var(--sage)}.line{stroke:var(--line)}.paper{fill:var(--paper)}.accent{fill:var(--accent)}.green{fill:var(--green)}</style><rect width="1400" height="710" class="paper"/><text x="64" y="78" font-size="40" class="serif">A bigger picture of Japanese.</text><text x="64" y="117" font-size="20" class="muted">Complete editions, with native metadata and readable references in the same ZIP.</text><text x="64" y="180" font-size="22">German lookup pairs</text><text x="1334" y="180" text-anchor="end" font-size="25">1,566,695</text><rect x="64" y="200" width="1270" height="12" rx="6" style="fill:var(--line)"/><rect x="64" y="200" width="1270.0" height="12" rx="6" class="accent"/><text x="64" y="242" font-size="17" class="muted">German meanings with English fallback</text><text x="64" y="292" font-size="22">English lookup pairs</text><text x="1334" y="292" text-anchor="end" font-size="25">1,080,167</text><rect x="64" y="312" width="1270" height="12" rx="6" style="fill:var(--line)"/><rect x="64" y="312" width="875.6" height="12" rx="6" class="green"/><text x="64" y="354" font-size="17" class="muted">Separate complete English edition</text><text x="64" y="404" font-size="22">Native metadata records</text><text x="1334" y="404" text-anchor="end" font-size="25">1,006,753</text><rect x="64" y="424" width="1270" height="12" rx="6" style="fill:var(--line)"/><rect x="64" y="424" width="816.1" height="12" rx="6" class="accent"/><text x="64" y="466" font-size="17" class="muted">Frequency + pitch, in each edition</text><text x="64" y="516" font-size="22">Native kanji records</text><text x="1334" y="516" text-anchor="end" font-size="25">10,384</text><rect x="64" y="536" width="1270" height="12" rx="6" style="fill:var(--line)"/><rect x="64" y="536" width="8.4" height="12" rx="6" class="green"/><text x="64" y="578" font-size="17" class="muted">Meanings and on / kun readings, in each edition</text><text x="64" y="676" font-size="17" class="muted">v1.0.3 release reports. Lookup pairs include names, spellings and reference entries; these are not unique-word counts.</text></svg>