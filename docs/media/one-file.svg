<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="title desc"><title id="title">One complete file, multiple compatible tools</title><desc id="desc">Source layers are packaged in one ZIP per definition language. Use that ZIP in Migaku, Yomitan and compatible importers. Host features vary.</desc><style>:root{--paper:#FAF8F4;--ink:#242622;--muted:#60645C;--line:#DADDD5;--accent:#906530;--green:#42684B;--dark:#151815;--light:#F4F3EC;--gold:#D7B685;--sage:#A9C7AE;--sans:system-ui,-apple-system,sans-serif;--serif:Georgia,"Times New Roman",serif}text{font-family:var(--sans);fill:var(--ink)}.serif{font-family:var(--serif)}.muted{fill:var(--muted)}.light{fill:var(--light)}.gold{fill:var(--gold)}.sage{fill:var(--sage)}.line{stroke:var(--line)}.paper{fill:var(--paper)}.accent{fill:var(--accent)}.green{fill:var(--green)}</style><style>.travel{animation:journey 7s linear infinite}@keyframes journey{to{stroke-dashoffset:-670}}@media(prefers-reduced-motion:reduce){.travel{animation:none}}</style><rect width="1400" height="300" style="fill:var(--dark)"/><path d="M360 145H1030" style="stroke:var(--sage);stroke-width:2;opacity:.4"/><path class="travel" d="M360 145H1030" style="stroke:var(--gold);stroke-width:3;stroke-dasharray:55 615"/>
<rect x="510" y="80" width="380" height="130" rx="16" style="fill:var(--dark);stroke:var(--gold)"/><text x="700" y="137" text-anchor="middle" font-size="29" class="light">One complete ZIP</text><text x="700" y="175" text-anchor="middle" font-size="18" class="sage">Choose German or English</text>
<text x="64" y="119" font-size="25" class="light">Trusted source layers</text><text x="64" y="161" font-size="18" class="sage">Vocabulary, names, grammar</text><text x="64" y="191" font-size="18" class="sage">Pitch, frequency, kanji</text><text x="1050" y="119" font-size="25" class="light">Your reading tools</text><text x="1050" y="161" font-size="18" class="sage">Migaku / Yomitan</text><text x="1050" y="191" font-size="18" class="sage">Compatible format importers</text><text x="64" y="264" font-size="17" class="sage">No separate feature packs. Native displays and mining integrations depend on the host.</text></svg>