<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc"><title id="title">Lossless German transfer size reduction</title><desc id="desc">Base64 payload reduced from 81,588,384 to 67,007,636 bytes, 17.9 percent. Chrome message limit is 67,108,864 bytes. Build guard also reserves 65,536 bytes for the message envelope.</desc><style>:root{--paper:#FAF8F4;--ink:#242622;--muted:#60645C;--line:#DADDD5;--accent:#906530;--green:#42684B;--dark:#151815;--light:#F4F3EC;--gold:#D7B685;--sage:#A9C7AE;--sans:system-ui,-apple-system,sans-serif;--serif:Georgia,"Times New Roman",serif}text{font-family:var(--sans);fill:var(--ink)}.serif{font-family:var(--serif)}.muted{fill:var(--muted)}.light{fill:var(--light)}.gold{fill:var(--gold)}.sage{fill:var(--sage)}.line{stroke:var(--line)}.paper{fill:var(--paper)}.accent{fill:var(--accent)}.green{fill:var(--green)}</style><rect width="1400" height="480" class="paper"/><text x="64" y="76" font-size="40" class="serif">Every record kept. A smaller journey.</text><text x="64" y="118" font-size="20" class="muted">German edition, Base64 transfer size. Millions of bytes, before the message envelope.</text>
<text x="64" y="190" font-size="22">1.0.2</text><rect x="180" y="165" width="970" height="42" rx="5" style="fill:var(--line)"/><text x="1190" y="194" font-size="25">81.59 MB</text>
<text x="64" y="275" font-size="22">1.0.3</text><rect x="180" y="250" width="796.6" height="42" rx="5" class="green"/><text x="1010" y="279" font-size="25">67.01 MB</text>
<path d="M977.2 145V313" style="stroke:var(--accent);stroke-dasharray:5 5"/><text x="980" y="342" font-size="18" class="muted">Chrome limit: 67.11 MB</text>
<text x="64" y="399" font-size="23">17.9% smaller transfer. Zero decoded records removed.</text><text x="64" y="439" font-size="17" class="muted">Both new ZIPs fit the build guard after Base64 encoding plus a reserved 64 KiB message envelope.</text></svg>